# 제43장: 실험 전에 미리 적어 두는 평가 지표와 합격 기준
# 이 파일은 제44장 이후의 학습을 시작하기 전에 확정하며, 결과를 본 뒤 고치지 않는다.
# 고쳐야 한다면 version을 올리고 고친 이유를 changes에 남긴다.
version: 2
data:
  source: datasets/fpga_qa/fpga_qa.json
  split: datasets/fpga_qa/split_v1.json
  general_eval: fixed eval (제21장 고정 데이터, 5 x 128 토큰)

metrics:
  domain_ppl:
    what: validation 문항의 답 부분 Perplexity(질문 토큰은 Loss에서 제외)
    pass: 학습 전보다 20% 이상 낮을 것
    max_ratio: 0.80
  keyword_hit:
    what: test 답에 핵심어가 들어 있는 비율(문항별 핵심어 중 몇 개를 맞혔는가의 평균)
    pass: 평균 0.60 이상
    min_mean: 0.60
  format_ok:
    what: 존댓말 평서문('다.')으로 끝나고 4문장 이하인 답의 비율
    pass: 0.80 이상
    min_rate: 0.80
    max_sentences: 4
  general_ppl:
    what: 일반 문장(고정 eval)의 Perplexity, 기존 능력이 무너지지 않았는지 확인
    pass: 학습 전보다 10% 넘게 오르지 않을 것
    max_ratio: 1.10

keywords:          # test 문항의 핵심어(사람이 정답을 보고 고름)
  fpga-010: [위치, 연결, 지연, 타이밍]
  fpga-018: [포트 이름, 순서, 잘못 연결]
  fpga-022: [상태 레지스터, 다음 상태, 출력 논리, default]
  fpga-031: [지연, 가장 긴, 최대 클럭 주파수]
  fpga-040: [LUT, 플립플롭, 블록 RAM, DSP]
  fpga-044: [알 수 없, 리셋, 구동]

dev_keywords:      # validation 문항의 핵심어(version 2에서 추가). 학습 중 판정은 이것으로 한다
  fpga-005: [곱셈, 누적, 전용, 필터]
  fpga-019: [반복, parameter, 인스턴스]
  fpga-024: [1억, 27비트, 반전]
  fpga-033: [셋업, 홀드, 중간 상태, 동기화기]
  fpga-041: [내부 신호, 캡처, 보드]
  fpga-049: [래치, else, 플립플롭]

changes:
  - version: 2
    what: validation 문항의 핵심어(dev_keywords)를 추가하고, 핵심어·형식 지표를 학습 중에는 validation으로 잰다
    why: 제47~49장에서 핵심어·형식을 test로 재고 있었다. 결과를 보며 다음 실험을 정하면 test가 설정 선택에 쓰여 마지막 평가가 낙관적이 된다. 합격선과 test 핵심어는 바꾸지 않는다
